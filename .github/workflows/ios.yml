name: iOS build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          XCODE_PATH="/Applications/Xcode_16.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 16.2 not found at $XCODE_PATH"
            xcodebuild -version
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Simulator build
        run: |
          xcodebuild -project Spark.xcodeproj -scheme Spark \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    runs-on: macos-14
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          XCODE_PATH="/Applications/Xcode_16.2.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::Xcode 16.2 not found at $XCODE_PATH"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Archive for device (unsigned)
        run: |
          xcodebuild -project Spark.xcodeproj -scheme Spark \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Try to export IPA
        id: export-ipa
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingAllowed</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Spark.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Package unsigned IPA (fallback)
        if: steps.export-ipa.outcome == 'failure'
        run: |
          APP_PATH="$RUNNER_TEMP/Spark.xcarchive/Products/Applications/Spark.app"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "Spark-unsigned.ipa" Payload

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spark-xcarchive-unsigned
          path: ${{ runner.temp }}/Spark.xcarchive
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spark-ipa
          path: |
            ${{ runner.temp }}/export/Spark.ipa
            ${{ runner.temp }}/Spark-unsigned.ipa
          if-no-files-found: warn

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          IPA="$RUNNER_TEMP/export/Spark.ipa"
          [ -f "$IPA" ] || IPA="$RUNNER_TEMP/Spark-unsigned.ipa"
          [ -f "$IPA" ] || { echo "没有可发布的 IPA，跳过发布"; exit 0; }

          TAG="build-${{ github.run_number }}"
          TITLE="Spark 未签名构建 #${{ github.run_number }}"
          SHORT_SHA="${{ github.sha }}"
          REF_NAME="${{ github.ref_name }}"

          cat > "$RUNNER_TEMP/release_body.md" <<EOF
          ## Spark 未签名构建

          - 标签：`$TAG`
          - 提交：`$SHORT_SHA`（分支 `$REF_NAME`）
          - 类型：pre-release
          - 附件：`Spark-unsigned.ipa`

          > ⚠️ **未签名（开发用）产物**，无法直接安装到真机。
          > 请下载后用 Xcode 或其他工具重新签名，或下载同名 Actions Artifact 中的 `.xcarchive` 在本机补签名。
          > 打包与签名方法见仓库 README「构建与打包（IPA）」。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA#Spark-unsigned.ipa" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/release_body.md"
          else
            gh release create "$TAG" "$IPA#Spark-unsigned.ipa" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release_body.md" \
              --prerelease
          fi
